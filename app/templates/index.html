<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>留言板</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        input, textarea {
            width: 100%;
            margin: 8px 0;
            padding:8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background:#2277dd;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
        .result {
            margin-top:20px;
            color:#229933;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>留言板</h2>
        <form action="/submit" method="POST">
            <label>你的名字：</label>
            <input type="text" name="username" required>

            <label>留言内容：</label>
            <textarea name="message" rows="4" required></textarea>

            <button type="submit">提交给后端</button>
        </form>

        {% if result %}
            <div class="result">{{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
